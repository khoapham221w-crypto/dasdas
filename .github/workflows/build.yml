name: Build FastCodeOCR Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name FastCodeOCR --collect-all rapidocr_onnxruntime main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: FastCodeOCR-Windows
          path: dist/FastCodeOCR.exe
